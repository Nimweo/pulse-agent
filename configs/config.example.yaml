# Pulse Agent Configuration Example
# Set this to true after reviewing all settings.
configured: false

# Server configuration
server:
  # Base API URL. The agent appends operation-specific paths such as /health and /ingest.
  base_url: "https://pulse.test/api/"
  # Optional API key for authentication
  api_key: ""
  # Request timeout in seconds
  timeout: 10

# Agent identification
agent:
  # Override system hostname (optional, uses os.Hostname() if not set)
  hostname: ""

# Collection intervals
intervals:
  # How often to collect metrics (in seconds)
  collect: 1
  # How often to send batched metrics to server (in seconds)
  send: 60

# Logging configuration
logging:
  # Log level: debug, info, warn, error
  level: "info"
  # Log format: text, json
  format: "text"

# Collectors configuration
collectors:
  # Operating system, kernel, uptime, virtualization, and CPU topology
  system:
    enabled: true
    interval: 60

  # Load metrics
  load:
    enabled: true
    interval: 1  # seconds

  # CPU metrics
  cpu:
    enabled: true
    interval: 1
    # Collect usage for each logical CPU in addition to total usage
    per_cpu: false

  # Memory and swap metrics
  memory:
    enabled: true
    interval: 1

  # Filesystem usage and disk I/O metrics
  disk:
    enabled: true
    interval: 1

  # Network throughput, packet, error, and drop metrics
  network:
    enabled: true
    interval: 1

  # GPU utilization, memory, temperature, and power when supported by the system
  gpu:
    enabled: true
    interval: 5

# Transport configuration
transport:
  # Enable gzip compression for outgoing requests
  compression: true
  # Maximum retry attempts after the initial send failure
  max_retries: 3
  # Retry backoff in seconds
  retry_backoff: 5

# Buffer configuration
buffer:
  # Maximum number of samples to keep in memory before forced send
  max_size: 10000
  # Enable disk spool for failed sends (not yet implemented)
  disk_spool_enabled: false
